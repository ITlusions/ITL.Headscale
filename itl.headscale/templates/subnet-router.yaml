{{- if .Values.subnetRouter.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: subnet-router
  namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: subnet-router
  namespace: {{ .Values.namespace.name }}
rules:
  # The official tailscale/tailscale image auto-detects it's running in
  # Kubernetes and stores its own tailnet state in a Secret named "tailscale"
  # in its own namespace by default (TS_KUBE_SECRET) - confirmed live
  # 2026-10-24: without this, the pod crash-loops with "missing get/update
  # permission on secret 'tailscale'". This replaces a PVC-based approach
  # for state - simpler, and it's what this image is actually designed to do.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Lets it write startup/debug Events against its own pod - optional per
  # its own log message, but cheap to grant and genuinely useful for
  # debugging a headless gateway with no other visibility.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: subnet-router
  namespace: {{ .Values.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: subnet-router
    namespace: {{ .Values.namespace.name }}
roleRef:
  kind: Role
  name: subnet-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subnet-router
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: subnet-router
spec:
  replicas: 1
  strategy:
    type: Recreate   # single tailnet identity - no rolling update
  selector:
    matchLabels:
      app.kubernetes.io/name: subnet-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subnet-router
    spec:
      # Removes one NAT layer (pod network -> node) for WireGuard's NAT
      # traversal/hole-punching - added 2026-10-24 after confirming the
      # phone's connection was relayed via DERP (ams) instead of direct.
      # Not guaranteed to fix it alone - the phone's own cellular
      # carrier-grade NAT is the other half of this and isn't something
      # the cluster side can control.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: subnet-router
      containers:
        - name: tailscale
          image: "{{ .Values.subnetRouter.image.repository }}:{{ .Values.subnetRouter.image.tag }}"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.subnetRouter.authKeySecretRef.name }}
                  key: {{ .Values.subnetRouter.authKeySecretRef.key }}
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--login-server={{ .Values.serverUrl }}"
            - name: TS_ROUTES
              value: {{ join "," .Values.subnetRouter.advertiseRoutes | quote }}
            - name: TS_USERSPACE
              value: "false"
            # Confirmed live 2026-10-24: without this, the bundled
            # iptables-legacy binary fails against Talos's kernel ("can't
            # initialize iptables table 'filter': Table does not exist") -
            # Talos is nftables-only. Forced explicitly rather than
            # TS_DEBUG_FIREWALL_MODE=auto, since auto's heuristic may still
            # pick iptables just because the binary is present, regardless
            # of whether the kernel actually supports it.
            - name: TS_DEBUG_FIREWALL_MODE
              value: "nftables"
            - name: TS_HOSTNAME
              value: {{ .Values.subnetRouter.hostname | quote }}
            # Lets the image write startup Events against its own pod, per
            # its own suggestion - needs the Role above too.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          resources:
            {{- toYaml (.Values.subnetRouter.resources | default dict) | nindent 12 }}
      volumes:
        - name: tun
          # NOT VERIFIED against Talos specifically: assumes /dev/net/tun
          # exists as a standard character device on every node (true for
          # almost any Linux kernel with the TUN/TAP driver, which is
          # nearly always built-in/loaded) - but Talos's minimal, hardened
          # design hasn't been confirmed to expose it. If this pod fails to
          # start citing /dev/net/tun, that's the first thing to check.
          hostPath:
            path: /dev/net/tun
            type: CharDevice
{{- end }}
